[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pushx"
version = "0.2.0"
description = "PushT-style manipulation environments in JAX."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "huterguier", email = "huterguier@gmail.com" }
]
dependencies = [
    "jax",
    "chex",
    "gxm@git+https://github.com/huterguier/gxm@main",
    "matplotlib",
    "jax2d",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
cuda = ["jax[cuda]"]
tpu = ["jax[tpu]"]
examples = ["rlax@git+https://github.com/huterguier/rlax"]

[project.urls]
Homepage = "https://github.com/huterguier/pushx"

[tool.setuptools.packages.find]
include = ["pushx", "pushx.*"]
exclude = ["images"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
per-file-ignores = { "pushx/letters.py" = ["E741"] }
